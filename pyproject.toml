[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finchecker"]

[project]
name = "a-share-factcheck"
version = "0.1.0"
description = "A-Share Financial Research & News Fact-Checker with Anti-Hallucination MCP Server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "akshare>=1.14",
    "pydantic>=2.5",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
finchecker = "finchecker.cli:main"
finchecker-mcp = "finchecker.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
